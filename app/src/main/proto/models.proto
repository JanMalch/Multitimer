syntax = "proto3";

import "google/protobuf/timestamp.proto";

option java_package = "io.github.janmalch.multitimer.models";
option java_multiple_files = true;

message AppConfig {
  repeated Timer timer = 1;
}

message Timer {
  // The name of the timer, which also acts as the ID.
  string name = 1;
  string color = 2;
}